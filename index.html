<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#F3F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121410" media="(prefers-color-scheme: dark)" />
    <link rel="alternate" type="application/rss+xml" title="Somasundaram Maharajan" href="/feed.xml" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340..480;1,9..144,400&display=swap" />
    <script>
      (function() {
        let stored;
        try {
          stored = localStorage.getItem('theme');
        } catch {
          // Follow the system preference when storage is blocked.
        }
        const isDark = stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
