<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1013" media="(prefers-color-scheme: dark)" />
    <link rel="alternate" type="application/rss+xml" title="s-maharajan" href="/feed.xml" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/src/assets/fraunces-latin-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function() {
        let stored;
        try {
          stored = localStorage.getItem('theme');
        } catch {
          // Follow the system preference when storage is blocked.
        }
        const isDark = stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
